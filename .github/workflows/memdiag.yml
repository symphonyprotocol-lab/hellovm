name: memdiag
on:
  push:
    branches: [claude/memdiag]
permissions:
  contents: read
jobs:
  memdiag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: {ref: main, path: before}
      - uses: actions/checkout@v7
        with: {ref: claude/stoic-solomon-795346, path: after}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-workspaces: before/kernel
          override: false
      - name: Build
        run: |
          (cd before/kernel && cargo build -p hellovm)
          (cd after/kernel && cargo build -p hellovm)
          uname -r; head -1 /etc/os-release; cat /sys/kernel/mm/transparent_hugepage/enabled
          ls -laL /bin/sleep /usr/bin/python3 /bin/sh
      - name: Measure
        run: |
          for v in before after; do
            sudo sh kernel/dev/memdiag.sh $PWD/$v/kernel/target/debug/hellovm 40 'sleep 20'
          done
          for v in before after; do
            sudo sh kernel/dev/memdiag.sh $PWD/$v/kernel/target/debug/hellovm 10 'python3 -c "import time; time.sleep(20)"'
          done
          for v in before after; do
            sudo sh kernel/dev/memdiag.sh $PWD/$v/kernel/target/debug/hellovm 10 'LC_ALL=C sleep 20'
          done
