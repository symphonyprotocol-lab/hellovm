[package]
name = "hellovm-sandbox"
description = "Least privilege for the hellovm kernel process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Test-only: HELLOVM_SECCOMP_LEARN measurement mode. Off by default.
insecure-test-hooks = []

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hellovm-platform-seccomp.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Enters the Seatbelt profile in a process of its own and tries the
# network from inside; no harness, so that process has no other thread.
[[test]]
name = "seatbelt_network"
harness = false
