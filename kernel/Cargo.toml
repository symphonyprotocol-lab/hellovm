[workspace]
resolver = "2"
members = [
    "core",
    "host",
    "platform-seccomp",
    "platform-hvf",
    "sandbox",
    "test-guest",
    "hellovm",
    "egress",
    "egress-wire",
    "control",
    "noded",
    "api",
]
# The fuzz targets need nightly and cargo-fuzz; see README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license-file = "../LICENSE"
publish = false
# Deliberately stricter than the language MSRV (about 1.88, when
# `as_chunks`, `is_multiple_of` and `io_error_more` became usable).
# rustup is pinned to 1.99.1 by `rust-toolchain.toml`.
rust-version = "1.99"

[workspace.dependencies]
hellovm = { path = "hellovm" }
hellovm-core = { path = "core" }
hellovm-host = { path = "host" }
hellovm-egress = { path = "egress" }
hellovm-egress-wire = { path = "egress-wire" }
hellovm-control = { path = "control" }
hellovm-noded = { path = "noded" }
hellovm-platform-seccomp = { path = "platform-seccomp" }
hellovm-platform-hvf = { path = "platform-hvf" }
hellovm-sandbox = { path = "sandbox" }
hellovm-test-guest = { path = "test-guest" }
libc = "0.2"
log = "0.4"
# The control plane (`control`, `noded`, `api`) speaks JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
