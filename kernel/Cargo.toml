[workspace]
resolver = "2"
members = ["core", "host", "platform-seccomp", "test-guest", "hellovm"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license-file = "../LICENSE"
publish = false

[workspace.dependencies]
hellovm-core = { path = "core" }
hellovm-host = { path = "host" }
hellovm-platform-seccomp = { path = "platform-seccomp" }
hellovm-test-guest = { path = "test-guest" }
libc = "0.2"
log = "0.4"
