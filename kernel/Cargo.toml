[workspace]
resolver = "2"
members = ["core", "host", "platform-seccomp", "test-guest", "hellovm"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license-file = "../LICENSE"
publish = false
# Deliberately stricter than the language MSRV (about 1.88, when
# `as_chunks`, `is_multiple_of` and `io_error_more` became usable).
# rustup is pinned to 1.99.1 by `rust-toolchain.toml`.
rust-version = "1.99"

[workspace.dependencies]
hellovm-core = { path = "core" }
hellovm-host = { path = "host" }
hellovm-platform-seccomp = { path = "platform-seccomp" }
hellovm-test-guest = { path = "test-guest" }
libc = "0.2"
log = "0.4"
