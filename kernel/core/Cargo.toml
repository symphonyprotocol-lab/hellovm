[package]
name = "hellovm-core"
description = "hellovm kernel core: Linux syscall semantics, independent of the host OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Test doubles (`testutil`) and entry points into crate-private parsers
# (`fuzzing`), for the fuzzers in kernel/fuzz. Off by default.
testutil = []

[dependencies]
# The hostname rule shared with the egress proxy (no other code).
hellovm-egress-wire.workspace = true
log.workspace = true
