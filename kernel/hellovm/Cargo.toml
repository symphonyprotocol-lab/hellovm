[package]
name = "hellovm"
description = "Runs a Linux program inside the hellovm kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Test-only: the `--splice-to` flag, which sends outbound flows to a
# loopback TCP address with no egress policy. Off by default.
insecure-test-hooks = ["hellovm-host/insecure-test-hooks"]

[dependencies]
hellovm-core.workspace = true
hellovm-host.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hellovm-platform-seccomp.workspace = true
libc.workspace = true

[dev-dependencies]
hellovm-test-guest.workspace = true
hellovm-host = { workspace = true, features = ["insecure-test-hooks"] }
hellovm-egress = { workspace = true, features = ["insecure-test-hooks"] }
