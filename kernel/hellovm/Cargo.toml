[package]
name = "hellovm"
description = "Runs a Linux program inside the hellovm kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
# Test-only: the `--splice-to` flag, which sends outbound flows to a
# loopback TCP address with no egress policy. Off by default.
# Also `--insecure-test-session` (the e2e tests' hardened kernel process),
# `--insecure-fence-test` and the HELLOVM_SECCOMP_LEARN measurement mode.
insecure-test-hooks = ["hellovm-host/insecure-test-hooks", "hellovm-sandbox/insecure-test-hooks"]

[dependencies]
hellovm-core.workspace = true
hellovm-host.workspace = true
hellovm-sandbox.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hellovm-platform-seccomp.workspace = true
libc.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
hellovm-platform-hvf.workspace = true
libc.workspace = true

[dev-dependencies]
# The tests run the kernel through `--insecure-test-session`.
hellovm = { path = ".", features = ["insecure-test-hooks"] }
hellovm-test-guest.workspace = true
hellovm-host = { workspace = true, features = ["insecure-test-hooks"] }
hellovm-egress = { workspace = true, features = ["insecure-test-hooks"] }
