[package]
name = "hellovm-noded"
description = "hellovm node daemon: keeps warm templates alive and runs sandboxes cloned from them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "hellovm-noded"
path = "src/main.rs"

[dependencies]
hellovm-control.workspace = true
libc.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hellovm.workspace = true
