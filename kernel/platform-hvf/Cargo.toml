[package]
name = "hellovm-platform-hvf"
description = "hellovm platform layer for macOS on Apple silicon, based on Hypervisor.framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
hellovm-core.workspace = true
hellovm-platform-arm64.workspace = true
log.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc.workspace = true

[dev-dependencies]
hellovm-host.workspace = true
hellovm-platform-arm64 = { workspace = true, features = ["testing"] }
hellovm-test-guest.workspace = true
